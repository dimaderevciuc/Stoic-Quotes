# Static analysis config. Run with `flutter analyze`.
# Base: flutter_lints recommended set, plus strict type checks and extra rules
# that catch real bugs or keep the code easy to read.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Strict modes: no silent dynamic casts, no inferred `dynamic`, no raw generics.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Forgetting to await a Future hides errors, so treat it as a warning.
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_build_context_synchronously: true
