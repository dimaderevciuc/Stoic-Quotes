name: stoic_quotes
description: "Stoic Quotes: private, offline Stoic reflections for hard moments."
# Private app, never published to pub.dev.
publish_to: 'none'

# version: <versionName>+<versionCode>. Bump for every test build, or Android refuses to update.
version: 1.2.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # csv and sqflite are temporary: replaced by Drift and the pipeline database in Phase 4.
  path: ^1.9.1
  flutter_onnxruntime: ^1.9.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    # Generated by `uv run stoic-embed export` in pipeline/, do not edit by hand.
    - assets/embedding/
    - assets/content/
    - assets/safety/
    # Font licenses, shown on the licenses page.
    - assets/fonts/Lora-OFL.txt
    - assets/fonts/Inter-OFL.txt

  # Bundled, so the app looks the same everywhere and never fetches fonts online.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# package:sqlite3 bundles SQLite through build hooks. SQLite3MultipleCiphers adds
# encryption for user.db without OpenSSL (SQLCipher's Flutter package is end of life).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
